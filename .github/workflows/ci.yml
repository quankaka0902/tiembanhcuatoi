name: Bakery CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bakery-ci-root
          MYSQL_DATABASE: tiembanh_ci_test
          MYSQL_USER: bakery_ci
          MYSQL_PASSWORD: bakery-ci-test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, intl, openssl, fileinfo, xml, zip, gd
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and create test key
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          npm ci

      - name: Lint and build
        run: |
          php vendor/bin/pint --test
          npm run lint
          npm run build

      - name: Test on SQLite
        run: php vendor/bin/phpunit --do-not-cache-result

      - name: Test on MySQL, including concurrent checkouts
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_DATABASE: tiembanh_ci_test
          DB_USERNAME: bakery_ci
          DB_PASSWORD: bakery-ci-test
          DB_URL: ''
        run: php vendor/bin/phpunit --do-not-cache-result --fail-on-skipped
